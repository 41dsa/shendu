# 叠在 docker-compose.prod.yml 上启用容器内 HTTPS。
# 将 fullchain.pem 与 privkey.pem 放到 deploy/certs/ 后执行：
#   WEB_PORT=80 docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d
services:
  web:
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
